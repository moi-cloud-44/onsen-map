.stamp-hero{position:relative;overflow:hidden;min-height:170px;background:linear-gradient(115deg,#e6f4ed 0%,#f8f7eb 55%,#fff0e4 100%);padding:32px 35px}
.stamp-hero:before{content:'✿  ✿  ✿';position:absolute;right:22px;top:15px;font-size:22px;letter-spacing:20px;color:#f3acb3;opacity:.75;transform:rotate(-12deg)}
.stamp-hero:after{content:'';position:absolute;right:-35px;bottom:-78px;width:300px;height:150px;background:#b7d5c2;border-radius:55% 55% 0 0;box-shadow:-115px 32px 0 8px #d2e5d4;opacity:.7}

.hero-sparkle{color:#e8a5ad;font-size:25px}.stamp-region>summary:before{content:'🌿';margin-right:8px}.stamp-pref>summary:before{content:'✿';color:#a84b48;margin-right:7px}

#missing-details{margin-top:18px}.connection-footer .settings{background:#fff1d5!important;border:2px solid #c4a273!important}

.stamp-page:before{content:'✿';position:absolute;right:30px;top:17px;color:#bc6c60;font-size:30px;opacity:.7;pointer-events:none}
.stamp-page:after{content:'♨';position:absolute;right:70px;top:20px;color:#b67b4b;font-size:24px;opacity:.55;pointer-events:none}
.stamp-summary{margin:0 0 15px!important;max-width:420px}.stamp-summary>div{background:linear-gradient(90deg,#fff4dc,#f4d9ad)!important;border:2px solid #cda36f!important;box-shadow:0 3px 0 #cba87555;border-radius:7px!important}.stamp-summary small{font-size:13px;color:#79543d}.stamp-summary strong{color:#a53e36;font-size:35px}.stamp-summary span{color:#87664a}

.stamp-pref>summary{background:linear-gradient(#f4dbac,#e7c18b)!important;border-bottom:1px solid #d0aa72;color:#5a3b2c!important;font-size:17px;padding:12px 15px!important}
.stamp-pref-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;padding:14px!important}

.stamp-tile.done{background:linear-gradient(150deg,#fff5df,#f7ddc2)!important;border-color:#c9896b!important}
.stamp-seal{width:83px;height:83px;border:5px double #b7a18a!important;color:#a9957d!important;background:#f7e9cf66!important;box-shadow:inset 0 0 0 3px #fdf5e6!important;transform:rotate(-9deg)}
.stamp-seal:before{font-size:31px!important;top:8px!important}.stamp-seal span{padding-top:28px!important;font-size:13px!important;letter-spacing:1px}

.stamp-name{color:#5d3e2b!important;font-size:13px!important;font-weight:800!important}.stamp-mini{color:#b7a58e!important}.stamp-mini.done{color:#a33e35!important}

/* 湯屋の旅手帳・仕上げ：スタンプの文字化け対策と和風の装飾 */
.stamp-count{
 display:inline-flex!important;vertical-align:middle;align-items:center;
 flex-wrap:wrap;gap:5px!important;margin-left:10px!important;
 max-width:100%;background:transparent!important;
}
.stamp-mini,.stamp-mini.done{
 display:inline-block!important;flex:0 0 16px;width:16px;height:16px;
 min-width:16px;min-height:16px;padding:0!important;margin:0!important;
 border-radius:50%!important;box-sizing:border-box;
 border:2px solid #a99b83!important;background:rgba(255,248,231,.45)!important;
 box-shadow:inset 0 0 0 2px #f5e7cc!important;
 font-size:0!important;line-height:0!important;
 text-decoration:none!important;vertical-align:middle;
}
.stamp-mini.done{
 border-color:#a63d36!important;background:#bd4d40!important;
 box-shadow:inset 0 0 0 2px #fbe7c7!important;
}
.stamp-pref>summary,.stamp-region>summary{
 line-height:1.65;overflow-wrap:anywhere;
}
.stamp-pref>summary::marker,.stamp-region>summary::marker{color:#754b31}
.stamp-pref>summary{display:list-item!important;list-style-position:inside}
.stamp-pref>summary .stamp-count{margin-top:3px}
.stamp-page{
 background:
 radial-gradient(ellipse at 88% 9%,rgba(236,176,119,.24),transparent 24%),
 repeating-linear-gradient(0deg,transparent 0,transparent 31px,rgba(128,83,49,.025) 32px),
 linear-gradient(115deg,#fff4d9,#f3dfb8)!important;
}
.stamp-page:before{
 content:'❀'!important;right:26px;top:18px;
 color:#b75d58!important;font-size:34px!important;opacity:.68;
}
.stamp-page:after{
 content:'♨'!important;right:76px;top:20px;
 color:#a66b48!important;font-size:27px!important;opacity:.58;
}
.stamp-tile{position:relative}
.stamp-tile:before{
 content:'';position:absolute;top:5px;left:6px;right:6px;height:3px;
 background:linear-gradient(90deg,transparent,#bc9560,transparent);opacity:.55;
}
.stamp-tile.done .stamp-seal{transform:rotate(-9deg)}
.stamp-region>summary{background:linear-gradient(90deg,#754535,#99593f,#ad7149)!important}
.stamp-pref>summary{background:linear-gradient(90deg,#f3dfb8,#e7c18b)!important}
.page-tab.active{background:linear-gradient(#a6463d,#7b342d)!important;color:#fff0d4!important}
.region-fold>.region-heading{background:linear-gradient(90deg,#815039,#ac7650)!important}
header{
 background-color:#243a36!important;
 border-bottom:5px solid #bc8a53!important;
}
@media(max-width:650px){
 .stamp-mini,.stamp-mini.done{flex-basis:13px;width:13px;height:13px;min-width:13px;min-height:13px}
 .stamp-count{gap:4px!important;margin-left:6px!important}
}

/* 添付の湯めぐり帳に合わせた和紙と版画のスタンプ */

#page-second .stamp-region-body{padding:10px 0!important}

#page-second .stamp-pref>summary:before{content:'❀';font-size:22px;color:#bd6b6b;margin-right:9px}
#page-second .stamp-pref-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:10px!important;padding:13px 2px!important}

window.setVisit=async function(id,next){if(!db){message('先にFirebaseに接続してください。',true);return}let old=!!visits[id];if(old===next)return;visits[id]=next;render();try{let r=await fetch(endpoint(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(next)});if(!r.ok)throw Error('HTTP '+r.status);$('status').textContent='保存しました。ほかの端末にも反映されます。'}catch(e){visits[id]=old;render();$('status').textContent='保存に失敗しました：'+e.message}}

async function sync(){if(!db||syncing)return;syncing=true;try{let r=await fetch(endpoint(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();visits=data&&typeof data==='object'?data:{};
 let cr=await fetch(coordsEndpoint(),{cache:'no-store'});if(cr.ok){let shared=await cr.json();if(shared&&typeof shared==='object'){for(let [id,v] of Object.entries(shared)){if(Number.isFinite(v?.lat)&&Number.isFinite(v?.lng)){if(!dirtyIds.has(id)){coords[id]=[v.lat,v.lng];verified[id]=true}}}}}render();message('🟢 共有データに接続中・約60秒ごとに更新')}catch(e){message('接続エラー：FirebaseのURLと読み書きルールを確認してください（'+e.message+'）',true)}finally{syncing=false}}
$('connect').onclick=()=>{let u=normalize($('dburl').value);if(!validUrl(u)){message('Firebase Realtime Databaseのhttps URLを入力してください。',true);return}db=u;localStorage.setItem('onsen_db_url',db);sync()};$('dburl').value=localStorage.getItem('onsen_db_url')||'https://japan-onsen-map-default-rtdb.firebaseio.com/';if($('dburl').value)$('connect').click();setInterval(()=>{if(!document.hidden)sync()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});

function focusPlace(id){
 const p=PLACES.find(x=>x.id===id);if(!p)return;
 selectedId=id;

 if(coords[id]){
  map.flyTo(coords[id],Math.max(map.getZoom(),12),{duration:0.6});
  updatePins();markers[id]?.openPopup();
  $('status').textContent='';
 }else{
  $('status').textContent=p.name+' は位置未登録です。位置を検索するか、座標を入力してください。';
 }
 render();
 const el=$('list').querySelector('[data-select="'+id+'"]');if(el){const fold=el.closest('details[data-pref]');if(fold){fold.open=true;closedPrefs.delete(fold.dataset.pref)}const region=el.closest('details[data-region]');if(region){region.open=true;closedRegions.delete(region.dataset.region)}}

   <div class="simple-head"><b>${safe(selected.name)}</b><span class="simple-state">${verified[selected.id]?'登録済み':c?'位置を確認中':'位置未登録'}</span></div>
   <div class="simple-help">座標を貼り付けるか、地図をタップして位置を指定できます。</div>

   <input id="coord-${selected.id}" data-coord="${selected.id}" type="text" inputmode="text" placeholder="例：38.225338, 140.727050" aria-label="緯度・経度" autocomplete="off">
   <div class="simple-buttons"><button class="edit-apply" data-paste="${selected.id}">地図に反映</button><button class="primary edit-confirm" data-verify="${selected.id}" ${c?'':'disabled'}>この位置で保存</button></div>
   <div class="simple-bottom"><button type="button" data-tap="${selected.id}" aria-pressed="${tapPlacementId===selected.id}">${tapPlacementId===selected.id?'タップ指定を終了':'📍 地図をタップして位置指定'}</button><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selected.mapName+' '+selected.pref)}">Googleマップで確認</a></div>
   <div class="simple-feedback" id="coord-feedback">${c?'現在の位置：'+c[0].toFixed(6)+', '+c[1].toFixed(6):'まだ位置は登録されていません。'}</div>

 }

}

$('review').addEventListener('click',async e=>{
 let b=e.target.closest('button');if(!b)return;let id=b.dataset.focus||b.dataset.verify||b.dataset.retry||b.dataset.apply||b.dataset.paste||b.dataset.tap;if(!id)return;
 if(b.dataset.tap){
  tapPlacementId=tapPlacementId===id?null:id;selectedId=id;
  render();
  if(tapPlacementId){
   if(coords[id])map.setView(coords[id],Math.max(map.getZoom(),13));
   $('status').textContent='地図上の登録したい場所を1回タップしてください。保存はまだ行われません。';
   document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'});
  }else $('status').textContent='地図タップ指定を終了しました。';
  return;
 }
 if(b.dataset.paste){
  const field=$('review').querySelector('[data-coord="'+id+'"]');
  const raw=(field?.value||'').trim();const parts=raw?raw.split(/[,，\s]+/).filter(Boolean):[$('review').querySelector('[data-lat="'+id+'"]')?.value?.trim(),$('review').querySelector('[data-lng="'+id+'"]')?.value?.trim()];
  const lat=parts.length===2&&parts[0]!==''?Number(parts[0]):NaN;
  const lng=parts.length===2&&parts[1]!==''?Number(parts[1]):NaN;
  if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180){$('status').textContent='入力形式を確認してください。例：38.225338360460704, 140.7270498069927';return}
  coords[id]=[lat,lng];verified[id]=false;dirtyIds.add(id);
  localStorage.setItem('onsen_coords_v1',JSON.stringify(coords));
  selectedId=id;editingId=null;tapPlacementId=null;render();map.setView(coords[id],13);updatePins();
  $('status').textContent='座標を地図に反映しました。位置を確認し「この位置で保存」を押してください。';
  return;
 }
 if(b.dataset.apply){let latText=$('review').querySelector('[data-lat="'+id+'"]').value.trim(),lngText=$('review').querySelector('[data-lng="'+id+'"]').value.trim();let lat=latText===''?NaN:Number(latText),lng=lngText===''?NaN:Number(lngText);if(!Number.isFinite(lat)||!Number.isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180){$('status').textContent='緯度・経度が正しくありません';return}coords[id]=[lat,lng];verified[id]=false;dirtyIds.add(id);localStorage.setItem('onsen_coords_v1',JSON.stringify(coords));render();map.setView(coords[id],13);$('status').textContent='座標を反映しました。位置を確認して確定・共有してください';return}
 if(b.dataset.focus){focusPlace(id);return}
 if(b.dataset.retry){delete coords[id];delete verified[id];localStorage.setItem('onsen_coords_v1',JSON.stringify(coords));if(markers[id]){map.removeLayer(markers[id]);delete markers[id]}render();return}
 if(!coords[id]){$('status').textContent='先に座標を地図に反映してください。';return}if(!db){$('status').textContent='位置を共有するには先にFirebaseへ接続してください';return}
 try{let val={lat:coords[id][0],lng:coords[id][1]};let r=await fetch(coordsEndpoint(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)});if(!r.ok)throw Error('HTTP '+r.status);verified[id]=true;dirtyIds.delete(id);editingId=null;tapPlacementId=null;render();$('status').textContent='位置を上書き保存して全員に共有しました。ほかの登録済み地点は変更していません。'}catch(err){$('status').textContent='位置の保存に失敗：'+err.message}
});
async function locatePlace(p){
 let term=p.mapName+' '+p.pref+' 日本';
 let r=await fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(term));
 if(!r.ok)throw Error('位置検索 HTTP '+r.status);
 let results=await r.json();
 if(!Array.isArray(results)||!results.length)throw Error('候補なし');
 let x=results.find(x=>String(x.properties?.title||'').includes(p.mapName))||results[0];
 let c=x.geometry?.coordinates;if(!Array.isArray(c)||c.length<2)throw Error('座標なし');
 let lat=Number(c[1]),lng=Number(c[0]);if(!(lat>24&&lat<46&&lng>122&&lng<154))throw Error('日本国外の座標');
 coords[p.id]=[lat,lng];localStorage.setItem('onsen_coords_v1',JSON.stringify(coords));render();return true;
}

 if(!matches.length){$('status').textContent='一致する温泉が見つかりませんでした。';return}
 if(matches.length===1){focusPlace(matches[0].id);$('status').textContent='';return}
 $('status').textContent=matches.length+'件見つかりました。右側の一覧から温泉を選択してください。';
 const first=matches[0],region=REGIONS.find(r=>r[1].includes(first.pref));
 if(region)closedRegions.delete(region[0]);
 closedPrefs.delete(first.pref);render();
 const firstButton=$('list').querySelector('[data-select="'+first.id+'"]');
 firstButton?.scrollIntoView({behavior:'smooth',block:'nearest'});
};
